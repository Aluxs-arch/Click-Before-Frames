name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: write

jobs:
  unit-tests:
    name: Unit tests (logic + i18n + JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run engine-independent tests
        run: bash tests/run.sh

  build-linux-input:
    name: Build linux-input.so
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y g++ libevdev-dev

      - name: Build
        working-directory: src/linux
        run: |
          mkdir -p ../../resources
          g++ -O2 -o ../../resources/linux-input.so linux-input.cpp -levdev

      - uses: actions/upload-artifact@v4
        with:
          name: linux-input.so
          path: resources/linux-input.so

  build:
    needs: ['unit-tests', 'build-linux-input']
    # The iOS leg currently fails inside the upstream Geode bindings
    # (FMOD types in GeneratedSource.cpp). Don't let it block the release.
    continue-on-error: ${{ matrix.config.target == 'iOS' }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Download linux-input.so
        uses: actions/download-artifact@v4
        with:
          name: linux-input.so
          path: resources

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          # sdk: nightly

  package:
    name: Package & release
    runs-on: ubuntu-latest
    needs: ['build']
    # Combine whatever platforms built successfully (iOS is best-effort).
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Merge platform .geode files
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Collect the merged .geode package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.build.outputs.build-output }}"
          FILE=$(find "$OUT" -maxdepth 1 -name '*.geode' -type f | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No .geode package was produced" >&2
            exit 1
          fi
          mkdir -p release
          cp "$FILE" release/click-before-frames-v2.0.0.geode
          echo "file=release/click-before-frames-v2.0.0.geode" >> "$GITHUB_OUTPUT"
          ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.pkg.outputs.file }}

      - name: Create GitHub Release + tag with the .geode file
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/abe17a81-click-before-frames'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo "Release v2.0.0 already exists - uploading the asset"
            gh release upload v2.0.0 release/click-before-frames-v2.0.0.geode --clobber
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/click-before-frames-v2.0.0.geode
          git commit -m "release: add v2.0.0 .geode package [skip ci]"
          git tag v2.0.0
          git push origin v2.0.0
          gh release create v2.0.0 release/click-before-frames-v2.0.0.geode \
            --verify-tag \
            --title "Click Before Frames v2.0.0" \
            --notes-file changelog.md
